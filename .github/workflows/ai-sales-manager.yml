name: 本部AI営業マネージャー（毎朝7時JST）

on:
  schedule:
    # 22:00 UTC = 翌朝 07:00 JST
    - cron: "0 22 * * *"
  workflow_dispatch: # 手動実行も可能

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger ai-sales-manager endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL or CRON_SECRET is not set in repo secrets"
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "$APP_URL/api/cron/ai-sales-manager" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 150)

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::ai-sales-manager endpoint returned non-200 status"
            exit 1
          fi
