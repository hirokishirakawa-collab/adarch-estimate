name: 入札ファインダー 日次同期（官公需情報ポータル）

on:
  schedule:
    # 毎朝 AM6:00 JST（UTC 21:00 前日）— 補助金同期(6:30)・TVerクロール(7:00)の前に流す
    - cron: "0 21 * * *"
  workflow_dispatch: # 手動実行も可能
    inputs:
      days:
        description: "遡って取り込む日数（初回の一括取り込み用）"
        required: false
        default: "14"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger tender sync endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAYS: ${{ github.event.inputs.days || '14' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL or CRON_SECRET is not set in repo secrets"
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "$APP_URL/api/cron/tender-sync?days=$DAYS" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 780)

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Tender sync endpoint returned non-200 status"
            exit 1
          fi
