name: ロイヤリティ MF入金状況 日次取込

on:
  schedule:
    # 毎朝 AM7:30 JST（UTC 22:30 前日）
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger royalty MF sync endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL or CRON_SECRET is not set in repo secrets"
            exit 1
          fi
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "$APP_URL/api/cron/royalty-mf-sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 600)
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json; echo ""
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::royalty-mf-sync returned non-200"
            exit 1
          fi
