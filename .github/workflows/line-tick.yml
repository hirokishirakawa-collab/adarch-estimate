name: LINE ステップ配信・予約一斉配信（5分ごと）

on:
  schedule:
    # 5分ごと（GitHub Actions の最短間隔。数分遅れることがある）
    - cron: "*/5 * * * *"
  workflow_dispatch: # 手動実行も可能

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger LINE tick endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL or CRON_SECRET is not set in repo secrets"
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "$APP_URL/api/cron/line-tick" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 120)

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::LINE tick endpoint returned non-200 status"
            exit 1
          fi
