name: 補助金ファインダー 日次同期（jGrants）

on:
  schedule:
    # 毎朝 AM6:30 JST（UTC 21:30 前日）— TVerクロール(7:00)の前に流す
    - cron: "30 21 * * *"
  workflow_dispatch: # 手動実行も可能

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger subsidy sync endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL or CRON_SECRET is not set in repo secrets"
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "$APP_URL/api/cron/subsidy-sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 780)

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Subsidy sync endpoint returned non-200 status"
            exit 1
          fi
