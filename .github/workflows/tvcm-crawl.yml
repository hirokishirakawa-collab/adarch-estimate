name: TVer広告 案件 自動クロール

on:
  schedule:
    # 毎朝 AM7:00 JST（UTC 22:00 前日）
    - cron: "0 22 * * *"
  workflow_dispatch: # 手動実行も可能

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger TVCM crawl endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL or CRON_SECRET is not set in repo secrets"
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "$APP_URL/api/cron/tvcm-crawl" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 540)

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Crawl endpoint returned non-200 status"
            exit 1
          fi
