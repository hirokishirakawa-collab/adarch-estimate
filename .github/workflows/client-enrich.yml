name: 取引先マップ 日次補完（Google口コミ・写真・社内構成）

on:
  schedule:
    # 毎朝 AM6:45 JST（UTC 21:45 前日）— 周年ファインダー(6:00)・補助金(6:30)の後
    - cron: "45 21 * * *"
  workflow_dispatch: # 手動実行も可能

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger client enrich endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL or CRON_SECRET is not set in repo secrets"
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "$APP_URL/api/cron/client-enrich?limit=40" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 780)

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Client enrich endpoint returned non-200 status"
            exit 1
          fi
